name: Build and Deploy

on:
  push:
    branches:
      - dev
      - master

env:
  AWS_REGION: us-east-2
  APP_NAME: sm-autonomous-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    env:
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Set outputs
        id: vars
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-7`" >> $GITHUB_ENV

      - name: Set environment name
        run: echo "ENVIRONMENT=${{ github.ref_name == 'master' && 'PRODUCTION' || 'DEVELOPMENT' }}" >> $GITHUB_ENV

      - name: Post to a Slack channel - STARTED
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: 'builds'
          payload: |
            {
              "text": "STARTED - deploying sm-autonomous-agent to ${{ env.ENVIRONMENT }}",
              "attachments": [
                  {
                      "color": "#9DC08B",
                      "blocks": [
                          {
                              "type": "section",
                              "text": {
                                  "type": "mrkdwn",
                                  "text": "*Deploying <https://github.com/${{github.repository}}|${{github.event.repository.name}}> to ${{env.ENVIRONMENT}}*\n*Started by changes from ${{github.actor}} on commit <https://github.com/${{github.repository}}/commit/${{github.sha}}|${{env.SHORT_SHA}}>*\n*<https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|see logs>*"
                              }
                          }
                      ]
                  }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_DEPLOYER_BOT_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v2

      # I remove this step because there is code from dev branch that isn't on master.
      # and the envs are different, so I created the .env to dev and prod manually.
      # - name: Create .env file
      #   run: |
      #     echo "PORT=${{ vars.PORT }}" >> .env
      #     echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
      #     echo "AUTONOMOUS_AGENT_NAME=${{ vars.AUTONOMOUS_AGENT_NAME }}" >> .env
      #     echo "PERSONA_MANAGER_REFRESH_INTERVAL=${{ vars.PERSONA_MANAGER_REFRESH_INTERVAL }}" >> .env
      #     echo "AIRTABLE_API_KEY=${{ secrets.AIRTABLE_API_KEY }}" >> .env
      #     echo "AIRTABLE_BASE_ID=${{ secrets.AIRTABLE_BASE_ID }}" >> .env
      #     echo "AIRTABLE_PERSONA_TABLE_ID=${{ secrets.AIRTABLE_PERSONA_TABLE_ID }}" >> .env
      #     echo "AIRTABLE_GAMES_TABLE_ID=${{ secrets.AIRTABLE_GAMES_TABLE_ID }}" >> .env
      #     echo "AIRTABLE_PLATFORMS_TABLE_ID=${{ secrets.AIRTABLE_PLATFORMS_TABLE_ID }}" >> .env

      - name: Create deployment package
        run: tar --exclude='./.git' --exclude='./.github' --exclude='./node_modules' -cvzf /tmp/sm-autonomous-agent.tar.gz .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2
        run: |
          aws s3 cp /tmp/sm-autonomous-agent.tar.gz s3://ec2-applications/sm-autonomous-agent.tar.gz
          aws s3 cp sm-autonomous-agent.service s3://ec2-applications/sm-autonomous-agent.service
          aws ssm send-command --instance-ids ${{ env.EC2_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters commands=["aws s3 cp s3://ec2-applications/sm-autonomous-agent.tar.gz /home/ubuntu/services/sm-autonomous-agent/sm-autonomous-agent.tar.gz"]
          aws ssm send-command --instance-ids ${{ env.EC2_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters commands=["aws s3 cp s3://ec2-applications/sm-autonomous-agent.service /home/ubuntu/services/sm-autonomous-agent/sm-autonomous-agent.service"]
          aws ssm send-command --instance-ids ${{ env.EC2_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters commands=["sudo mv /home/ubuntu/services/sm-autonomous-agent/sm-autonomous-agent.service /etc/systemd/system/sm-autonomous-agent.service"]
          aws ssm send-command --instance-ids ${{ env.EC2_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters commands=["tar -xvzf /home/ubuntu/services/sm-autonomous-agent/sm-autonomous-agent.tar.gz -C /home/ubuntu/services/sm-autonomous-agent/"]
          aws ssm send-command --instance-ids ${{ env.EC2_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters commands=["cd /home/ubuntu/services/sm-autonomous-agent && /home/ubuntu/.bun/bin/bun install"]
          aws ssm send-command --instance-ids ${{ env.EC2_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters commands=["sudo systemctl daemon-reload"]
          aws ssm send-command --instance-ids ${{ env.EC2_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters commands=["sudo systemctl enable sm-autonomous-agent"]
          aws ssm send-command --instance-ids ${{ env.EC2_INSTANCE_ID }} --document-name "AWS-RunShellScript" --parameters commands=["sudo systemctl restart sm-autonomous-agent"]

      - name: Wait for application to start
        run: sleep 10

      - name: Health check
        uses: jtalk/url-health-check-action@v3
        with:
          url: ${{ vars.API_URL }}/health
          max-attempts: 5
          retry-delay: 10s

      - name: Post to a Slack channel - SUCCESS
        if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: 'builds'
          payload: |
            {
              "text": "SUCCESS - deploying sm-autonomous-agent to ${{ env.ENVIRONMENT }}",
              "attachments": [
                  {
                      "color": "#9DC08B",
                      "blocks": [
                          {
                              "type": "section",
                              "text": {
                                  "type": "mrkdwn",
                                  "text": "*Deploying <https://github.com/${{github.repository}}|${{github.event.repository.name}}> to ${{env.ENVIRONMENT}}*\n*Started by changes from ${{github.actor}} on commit <https://github.com/${{github.repository}}/commit/${{github.sha}}|${{env.SHORT_SHA}}>*\n*<https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|see logs>*"
                              }
                          }
                      ]
                  }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_DEPLOYER_BOT_TOKEN }}

      - name: Post to a Slack channel - FAILURE
        if: failure()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: 'builds'
          payload: |
            {
              "text": "FAILURE - deploying sm-autonomous-agent to ${{ env.ENVIRONMENT }} <!channel>",
              "attachments": [
                  {
                      "color": "#E21818",
                      "blocks": [
                          {
                              "type": "section",
                              "text": {
                                  "type": "mrkdwn",
                                  "text": "*Deploying <https://github.com/${{github.repository}}|${{github.event.repository.name}}> to ${{env.ENVIRONMENT}}  <!channel>*\n*Started by changes from ${{github.actor}} on commit <https://github.com/${{github.repository}}/commit/${{github.sha}}|${{env.SHORT_SHA}}>*\n*<https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|see logs>*"
                              }
                          }
                      ]
                  }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_DEPLOYER_BOT_TOKEN }}
